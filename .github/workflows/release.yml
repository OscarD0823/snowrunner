name: Publicar aplicación para Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run check

      - name: Crear instalador
        run: npm run make

      - name: Publicar archivos de actualización
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            out/make/squirrel.windows/x64/SnowRunner Studio Setup.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
